<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClickIt — Find the Perfect Shot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F5F0E8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 48px; font-weight: 900; letter-spacing: -0.03em; color: #1A1714; margin-bottom: 12px; }
    p { font-size: 18px; color: rgba(26,23,20,0.6); max-width: 400px; line-height: 1.6; margin-bottom: 32px; }
    a {
      display: inline-block;
      background: #1A1714;
      color: #F5F0E8;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>ClickIt</h1>
  <p>Discover and share the best photo spots near you.</p>
  <a href="https://apps.apple.com">Download on the App Store</a>
</body>
</html>
