<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset Password — ClickIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1A1714;
      --cream: #F5F0E8;
      --cream2: #EDE8DF;
      --d40: rgba(26,23,20,0.40);
      --d12: rgba(26,23,20,0.12);
      --d06: rgba(26,23,20,0.06);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--cream);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* subtle grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .wordmark {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.01em;
      color: var(--d40);
      text-align: center;
      margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 36px 32px 32px;
      box-shadow: 0 2px 0 var(--d12), 0 16px 48px rgba(26,23,20,0.08);
    }

    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--d06);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 14px;
      color: var(--d40);
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--d40);
      margin-bottom: 7px;
    }

    input[type="password"] {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--d12);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
      -webkit-appearance: none;
    }

    input[type="password"]:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(26,23,20,0.08);
    }

    .error-box {
      display: none;
      background: rgba(220,53,69,0.07);
      border: 1px solid rgba(220,53,69,0.18);
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 13px;
      color: #b02a37;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      background: var(--ink);
      border: none;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      color: var(--cream);
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: default; transform: none; }

    /* success state */
    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(39,174,96,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .success-card { text-align: center; }
    .success-card h1 { margin-bottom: 10px; }
    .success-card .subtitle { margin-bottom: 28px; }

    .open-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      background: var(--ink);
      color: var(--cream);
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .open-btn:active { transform: scale(0.98); }

    /* invalid state */
    .invalid-card { text-align: center; }
    .invalid-card h1 { margin-bottom: 10px; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid var(--d12);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-card { text-align: center; }
    .loading-card h1 { font-size: 18px; color: var(--d40); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">ClickIt</div>
    <div class="card" id="card">
      <div class="loading-card">
        <div class="spinner"></div>
        <h1>Verifying link…</h1>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jgzgrymoabfvqdoejawc.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnemdyeW1vYWJmdnFkb2VqYXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM2NDkzNDksImV4cCI6MjA1OTIyNTM0OX0.moJbRtNWqFdlBq-9dBHMqWINQ4oT4-CCR3HqFtjIOgE';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    async function init() {
      const hash = window.location.hash;
      const params = new URLSearchParams(hash.replace(/^#/, ''));
      const type = params.get('type');
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');

      if (type === 'recovery' && accessToken) {
        await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' });
        showForm();
      } else {
        showInvalid();
      }
    }

    function showInvalid() {
      document.getElementById('card').innerHTML = `
        <div class="invalid-card">
          <div class="icon-wrap" style="margin:0 auto 22px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
          </div>
          <h1>Link expired</h1>
          <p class="subtitle">This reset link has already been used or has expired. Open ClickIt and request a new one.</p>
        </div>
      `;
    }

    function showForm() {
      document.getElementById('card').innerHTML = `
        <div class="icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>New password</h1>
        <p class="subtitle">Choose a strong password for your ClickIt account.</p>
        <div class="error-box" id="err"></div>
        <div class="field">
          <label>New password</label>
          <input type="password" id="pass" placeholder="At least 8 characters" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password" />
        </div>
        <button class="btn" id="btn" onclick="submit()">Update password</button>
      `;
      document.getElementById('pass').focus();
    }

    async function submit() {
      const pass = document.getElementById('pass').value;
      const confirm = document.getElementById('confirm').value;
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');

      err.style.display = 'none';

      if (pass.length < 8) {
        err.textContent = 'Password must be at least 8 characters.';
        err.style.display = 'block';
        return;
      }
      if (pass !== confirm) {
        err.textContent = 'Passwords don\'t match — try again.';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating…';

      const { error } = await sb.auth.updateUser({ password: pass });

      if (error) {
        err.textContent = error.message || 'Something went wrong. Please try again.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Update password';
      } else {
        showSuccess();
      }
    }

    function showSuccess() {
      document.getElementById('card').innerHTML = `
        <div class="success-card">
          <div class="success-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <h1>Password updated</h1>
          <p class="subtitle">You're all set. Open ClickIt and sign in with your new password.</p>
          <button class="open-btn" onclick="openApp()">
            Open ClickIt
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>
      `;
    }

    function openApp() {
      window.location.href = 'clickit://nav?screen=map';
      // fallback: if app isn't installed, do nothing
    }

    init();
  </script>
</body>
</html>
